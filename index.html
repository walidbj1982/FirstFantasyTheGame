<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>First Fantasy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="touch">
  <div class="dpad">
    <button data-btn="up" class="up">&#9650;</button>
    <button data-btn="left" class="left">&#9664;</button>
    <button data-btn="right" class="right">&#9654;</button>
    <button data-btn="down" class="down">&#9660;</button>
  </div>
  <div class="ab">
    <button data-btn="b" class="b">B</button>
    <button data-btn="a" class="a">A</button>
  </div>
</div>
<div id="help">Arrows/WASD move &middot; Z/Enter = A (confirm, talk) &middot; X/Esc = B (cancel, menu)</div>

<script src="js/data/config.js"></script>
<script src="js/data/cast.js"></script>
<script src="js/engine.js"></script>
<script src="js/sprites.js"></script>
<script src="js/data/music.js"></script>
<script src="js/data/rules.js"></script>
<script src="js/data/enemies.js"></script>
<script src="js/data/world.js"></script>
<script src="js/state.js"></script>
<script src="js/ui.js"></script>
<script src="js/battle.js"></script>
<script src="js/field.js"></script>
<script src="js/menu.js"></script>
<script src="js/data/story.js"></script>
<script src="js/main.js"></script>
</body>
</html>
